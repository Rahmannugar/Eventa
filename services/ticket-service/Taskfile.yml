version: '3'
tasks:
  generate: docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.29.0 generate
  build: go build ./...
  test:
    cmds:
      - go test -short ./...
      - go test ./test/integration/...
  test:unit: go test -short ./...
  test:integration: go test ./test/integration/...
  lint: golangci-lint run
  fmt: gofmt -w cmd internal test
  plans:
    cmds:
      - docker compose -f ../../compose.yaml up -d --wait ticket-database
      - go run ./cmd/ticket-query-plans
