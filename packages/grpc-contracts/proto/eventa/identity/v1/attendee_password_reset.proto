syntax = "proto3";

package eventa.identity.v1;

message ForgotAttendeePasswordRequest {
  string email = 1;
}

message ForgotAttendeePasswordResponse {
  bool accepted = 1;
}

message ResetAttendeePasswordRequest {
  string email = 1;
  string code = 2;
  string new_password = 3;
}

message ResetAttendeePasswordResponse {
  bool password_reset = 1;
}
