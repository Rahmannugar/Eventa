syntax = "proto3";

package eventa.event.v1;

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_DRAFT = 1;
  EVENT_STATUS_PUBLISHED = 2;
}

enum EventMediaSlot {
  EVENT_MEDIA_SLOT_UNSPECIFIED = 0;
  EVENT_MEDIA_SLOT_COVER = 1;
  EVENT_MEDIA_SLOT_GALLERY_1 = 2;
  EVENT_MEDIA_SLOT_GALLERY_2 = 3;
  EVENT_MEDIA_SLOT_GALLERY_3 = 4;
  EVENT_MEDIA_SLOT_GALLERY_4 = 5;
}

enum EventMediaUploadStatus {
  EVENT_MEDIA_UPLOAD_STATUS_UNSPECIFIED = 0;
  EVENT_MEDIA_UPLOAD_STATUS_PENDING = 1;
  EVENT_MEDIA_UPLOAD_STATUS_ATTACHED = 2;
  EVENT_MEDIA_UPLOAD_STATUS_REJECTED = 3;
  EVENT_MEDIA_UPLOAD_STATUS_CONFLICT = 4;
  EVENT_MEDIA_UPLOAD_STATUS_EXPIRED = 5;
}

message Event {
  string event_id = 1;
  string title = 2;
  EventStatus status = 3;
  string created_by_admin_id = 4;
  string created_at = 5;
  string updated_at = 6;
  int32 version = 7;
  optional string description = 8;
  optional string category = 9;
  optional string starts_at = 10;
  optional string ends_at = 11;
  optional string time_zone = 12;
  Venue venue = 13;
  repeated EventMedia media = 14;
  optional string published_at = 15;
}

message PublishedEvent {
  string event_id = 1;
  string title = 2;
  string description = 3;
  string category = 4;
  string starts_at = 5;
  string ends_at = 6;
  string time_zone = 7;
  Venue venue = 8;
  repeated EventMedia media = 9;
  string published_at = 10;
  int32 version = 11;
}

message EventMedia {
  string media_id = 1;
  EventMediaSlot slot = 2;
  string url = 3;
  string content_type = 4;
  int32 size_bytes = 5;
  int32 width = 6;
  int32 height = 7;
}

message Venue {
  string name = 1;
  string address_line_1 = 2;
  optional string address_line_2 = 3;
  string city = 4;
  optional string region = 5;
  optional string postal_code = 6;
  string country_code = 7;
}

message CreateDraftEventRequest {
  string admin_id = 1;
  string title = 2;
}

message CreateDraftEventResponse {
  Event event = 1;
}

message GetAdminEventRequest {
  string event_id = 1;
}

message GetAdminEventResponse {
  Event event = 1;
}

message GetPublishedEventRequest {
  string event_id = 1;
}

message GetPublishedEventResponse {
  PublishedEvent event = 1;
}

message UpdateDraftEventRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  string title = 4;
  string description = 5;
  string category = 6;
  string starts_at = 7;
  string ends_at = 8;
  string time_zone = 9;
  Venue venue = 10;
}

message UpdateDraftEventResponse {
  Event event = 1;
}

message CreateEventMediaUploadRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  EventMediaSlot slot = 4;
  string content_type = 5;
  int32 size_bytes = 6;
}

message CreateEventMediaUploadResponse {
  string upload_id = 1;
  string upload_url = 2;
  map<string, string> required_headers = 3;
  string expires_at = 4;
  string verification_deadline_at = 5;
}

message GetEventMediaUploadRequest {
  string event_id = 1;
  string upload_id = 2;
}

message GetEventMediaUploadResponse {
  string upload_id = 1;
  EventMediaUploadStatus status = 2;
  EventMediaSlot slot = 3;
  string expires_at = 4;
  optional int32 attached_event_version = 5;
  optional string failure_code = 6;
  string verification_deadline_at = 7;
}

message RemoveEventMediaRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  EventMediaSlot slot = 4;
}

message RemoveEventMediaResponse {
  int32 event_version = 1;
}

message PublishEventRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
}

message PublishEventResponse {
  Event event = 1;
}
