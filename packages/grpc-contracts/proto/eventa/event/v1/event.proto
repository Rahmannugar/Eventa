syntax = "proto3";

package eventa.event.v1;

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_DRAFT = 1;
  EVENT_STATUS_PUBLISHED = 2;
}

enum AdminEventSort {
  ADMIN_EVENT_SORT_UNSPECIFIED = 0;
  ADMIN_EVENT_SORT_UPDATED_DESC = 1;
  ADMIN_EVENT_SORT_EVENT_DATE_ASC = 2;
  ADMIN_EVENT_SORT_EVENT_DATE_DESC = 3;
}

enum EventMediaSlot {
  EVENT_MEDIA_SLOT_UNSPECIFIED = 0;
  EVENT_MEDIA_SLOT_COVER = 1;
  EVENT_MEDIA_SLOT_GALLERY_1 = 2;
  EVENT_MEDIA_SLOT_GALLERY_2 = 3;
  EVENT_MEDIA_SLOT_GALLERY_3 = 4;
  EVENT_MEDIA_SLOT_GALLERY_4 = 5;
}

enum EventMediaUploadStatus {
  EVENT_MEDIA_UPLOAD_STATUS_UNSPECIFIED = 0;
  EVENT_MEDIA_UPLOAD_STATUS_PENDING = 1;
  EVENT_MEDIA_UPLOAD_STATUS_ATTACHED = 2;
  EVENT_MEDIA_UPLOAD_STATUS_REJECTED = 3;
  EVENT_MEDIA_UPLOAD_STATUS_CONFLICT = 4;
  EVENT_MEDIA_UPLOAD_STATUS_EXPIRED = 5;
}

message Event {
  string event_id = 1;
  string title = 2;
  EventStatus status = 3;
  string created_by_admin_id = 4;
  string created_at = 5;
  string updated_at = 6;
  int32 version = 7;
  optional string description = 8;
  optional string category = 9 [deprecated = true];
  optional string starts_at = 10;
  optional string ends_at = 11;
  optional string time_zone = 12;
  Venue venue = 13;
  repeated EventMedia media = 14;
  optional string published_at = 15;
  repeated string categories = 16;
}

message PublishedEvent {
  string event_id = 1;
  string title = 2;
  string description = 3;
  string category = 4 [deprecated = true];
  string starts_at = 5;
  string ends_at = 6;
  string time_zone = 7;
  Venue venue = 8;
  repeated EventMedia media = 9;
  string published_at = 10;
  int32 version = 11;
  repeated string categories = 12;
}

message EventMedia {
  string media_id = 1;
  EventMediaSlot slot = 2;
  string url = 3;
  string content_type = 4;
  int32 size_bytes = 5;
  int32 width = 6;
  int32 height = 7;
}

message Venue {
  string name = 1;
  string address_line_1 = 2;
  optional string address_line_2 = 3;
  string city = 4;
  optional string region = 5;
  optional string postal_code = 6;
  string country_code = 7;
  string address_line_one = 8;
  optional string address_line_two = 9;
  optional string region_code = 10;
}

message CreateDraftEventRequest {
  string admin_id = 1;
  string title = 2;
  string description = 3;
  repeated string categories = 4;
  string starts_at = 5;
  string ends_at = 6;
  string time_zone = 7;
  Venue venue = 8;
}

message CreateDraftEventResponse {
  Event event = 1;
}

message GetAdminEventRequest {
  string event_id = 1;
}

message GetAdminEventResponse {
  Event event = 1;
}

message AdminEventSummary {
  string event_id = 1;
  string title = 2;
  repeated string categories = 3;
  EventStatus status = 4;
  optional string starts_at = 5;
  optional string ends_at = 6;
  optional string time_zone = 7;
  Venue venue = 8;
  string updated_at = 9;
}

message ListAdminEventsRequest {
  int32 page_size = 1;
  optional string page_token = 2;
  optional string search = 3;
  optional string country_code = 4;
  optional string region_code = 5;
  AdminEventSort sort = 6;
}

message ListAdminEventsResponse {
  repeated AdminEventSummary events = 1;
  optional string next_page_token = 2;
}

message GetPublishedEventRequest {
  string event_id = 1;
}

message GetPublishedEventResponse {
  PublishedEvent event = 1;
}

message UpdateDraftEventRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  string title = 4;
  string description = 5;
  string category = 6 [deprecated = true];
  string starts_at = 7;
  string ends_at = 8;
  string time_zone = 9;
  Venue venue = 10;
  repeated string categories = 11;
}

message UpdateDraftEventResponse {
  Event event = 1;
}

message EventTicketType {
  string ticket_type_id = 1;
  string event_id = 2;
  string name = 3;
  optional string description = 4;
  int32 price_minor = 5;
  int32 allocation = 6 [deprecated = true];
  string sales_start_at = 7;
  string sales_end_at = 8;
  string created_at = 9;
  string updated_at = 10;
  string ticket_currency_id = 11;
  int32 capacity = 12;
  int32 reserved_quantity = 13;
  int32 sold_quantity = 14;
  int32 available_quantity = 15;
}

message EventTicketCurrency {
  string ticket_currency_id = 1;
  string event_id = 2;
  string currency = 3;
  string created_at = 4;
  string updated_at = 5;
}

message DefineEventTicketCurrencyRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  string currency = 4;
}

message DefineEventTicketCurrencyResponse {
  EventTicketCurrency ticket_currency = 1;
  int32 event_version = 2;
}

message CreateEventTicketTypeRequest {
  option deprecated = true;
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  string name = 4;
  optional string description = 5;
  string currency = 6;
  int32 price_minor = 7;
  int32 allocation = 8;
  string sales_start_at = 9;
  string sales_end_at = 10;
}

message AddEventTicketTypeRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  string name = 4;
  optional string description = 5;
  string ticket_currency_id = 6;
  int32 price_minor = 7;
  int32 capacity = 8;
  string sales_start_at = 9;
  string sales_end_at = 10;
}

message AddEventTicketTypeResponse {
  EventTicketType ticket_type = 1;
  int32 event_version = 2;
}

message UpdateEventTicketTypeRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  string ticket_type_id = 4;
  string name = 5;
  optional string description = 6;
  int32 price_minor = 7;
  int32 capacity = 8;
  string sales_start_at = 9;
  string sales_end_at = 10;
}

message UpdateEventTicketTypeResponse {
  EventTicketType ticket_type = 1;
  int32 event_version = 2;
}

message RetireEventTicketTypeRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  string ticket_type_id = 4;
}

message RetireEventTicketTypeResponse {
  int32 event_version = 1;
}

message CreateEventTicketTypeResponse {
  option deprecated = true;
  EventTicketType ticket_type = 1;
  int32 event_version = 2;
}

message ListEventTicketTypesRequest {
  option deprecated = true;
  string event_id = 1;
}

message ListEventTicketTypesResponse {
  option deprecated = true;
  optional string currency = 1;
  int32 event_version = 2;
  repeated EventTicketType ticket_types = 3;
}

message GetEventTicketCatalogueRequest {
  string event_id = 1;
}

message GetEventTicketCatalogueResponse {
  repeated EventTicketCurrency ticket_currencies = 1;
  int32 event_version = 2;
  repeated EventTicketType ticket_types = 3;
}

message CreateEventMediaUploadRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  EventMediaSlot slot = 4;
  string content_type = 5;
  int32 size_bytes = 6;
}

message CreateEventMediaUploadResponse {
  string upload_id = 1;
  string upload_url = 2;
  map<string, string> required_headers = 3;
  string expires_at = 4;
  string verification_deadline_at = 5;
}

message GetEventMediaUploadRequest {
  string event_id = 1;
  string upload_id = 2;
}

message GetEventMediaUploadResponse {
  string upload_id = 1;
  EventMediaUploadStatus status = 2;
  EventMediaSlot slot = 3;
  string expires_at = 4;
  optional int32 attached_event_version = 5;
  optional string failure_code = 6;
  string verification_deadline_at = 7;
}

message RemoveEventMediaRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
  EventMediaSlot slot = 4;
}

message RemoveEventMediaResponse {
  int32 event_version = 1;
}

message PublishEventRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
}

message PublishEventResponse {
  Event event = 1;
}

message RetireDraftEventRequest {
  string admin_id = 1;
  string event_id = 2;
  int32 expected_version = 3;
}

message RetireDraftEventResponse {
  int32 event_version = 1;
}
