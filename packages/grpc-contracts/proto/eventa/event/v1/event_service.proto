syntax = "proto3";

package eventa.event.v1;

import "eventa/event/v1/event.proto";

service EventService {
  rpc CreateDraftEvent(CreateDraftEventRequest) returns (CreateDraftEventResponse);
  rpc ListAdminEvents(ListAdminEventsRequest) returns (ListAdminEventsResponse);
  rpc GetAdminEvent(GetAdminEventRequest) returns (GetAdminEventResponse);
  rpc GetPublishedEvent(GetPublishedEventRequest) returns (GetPublishedEventResponse);
  rpc UpdateDraftEvent(UpdateDraftEventRequest) returns (UpdateDraftEventResponse);
  rpc CreateEventMediaUpload(CreateEventMediaUploadRequest) returns (CreateEventMediaUploadResponse);
  rpc GetEventMediaUpload(GetEventMediaUploadRequest) returns (GetEventMediaUploadResponse);
  rpc RemoveEventMedia(RemoveEventMediaRequest) returns (RemoveEventMediaResponse);
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
}
