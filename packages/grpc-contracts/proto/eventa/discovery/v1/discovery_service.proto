syntax = "proto3";

package eventa.discovery.v1;

import "eventa/discovery/v1/discovery.proto";

service DiscoveryService {
  rpc SearchEvents(SearchEventsRequest) returns (SearchEventsResponse);
  rpc RecommendEvents(RecommendEventsRequest) returns (RecommendEventsResponse);
  rpc SimilarEvents(SimilarEventsRequest) returns (SimilarEventsResponse);
  rpc GetAttendeeInterests(GetAttendeeInterestsRequest) returns (GetAttendeeInterestsResponse);
  rpc SetAttendeeInterests(SetAttendeeInterestsRequest) returns (SetAttendeeInterestsResponse);
}
